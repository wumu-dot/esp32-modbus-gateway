; 最小可跑骨架：ESP32-S3 (N16R8) 做 RS485 (Modbus RTU) 主站 读 SoundDog 从站，上 MQTT
; 板子：恩欣 ESP32-S3-N16R8  (16MB Flash QSPI + 8MB PSRAM Octal SPI, USB-TOTY CH343)
; 平台：PlatformIO + Arduino core for ESP32
;
; 依赖（三源已验）：
;   - emelianov/modbus-esp8266 @4.1.0  → ModbusRTU 主站库（RTU 主/从、RS-485；兼容 ESP32）
;   - knolleary/PubSubClient           → MQTT 客户端
;
; 烧录：pio run -t upload     （板子 Type-C 接电脑，走 CH343 UART）
; 查看串口：pio device monitor -b 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---- N16R8 内存规格（16MB Flash + 8MB PSRAM opi）----
board_build.mcu = esp32s3
board_build.f_flash = 80000000L        ; Flash 80MHz（N16R8 支持 QIO 80）
board_build.f_cpu = 240000000L
board_build.flash_mode = qio           ; Flash QIO
board_build.flash_size = 16MB          ; 16MB Flash
board_build.psram_type = opi           ; 8MB Octal SPI PSRAM（R 表示 OPI）
board_build.arduino.memory_type = qio_opi   ; Flash QIO + PSRAM OPI

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0      ; 用 CH343 硬件 UART 烧录/调试，不用 USB CDC
    -DBOARD_HAS_PSRAM=1              ; 启用 PSRAM
    -mfix-esp32-psram-cache-issue      ; PSRAM cache 修正（Arduino core 建议）

; 固定库版本（避免上游漂移破坏编译）
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    knolleary/PubSubClient@^2.8.0

upload_protocol = esptool
; upload_port 留空：板插上后先 pio device list 查实际串口，或：
; pio run -t upload --upload-port COMxx
